name: sentrix
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentrix
      POSTGRES_USER: sentrix
      POSTGRES_PASSWORD: sentrix-local
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U sentrix"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentrix:sentrix-local@db/sentrix
      DEMO_PASSWORD: ${SENTRIX_DEMO_PASSWORD:-Sentrix-local-demo}
      LAB_MODE: ${SENTRIX_LAB_MODE:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${SENTRIX_PORT:-8130}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  data:
